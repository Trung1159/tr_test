name: Facebook daily post

on:
  schedule:
    # 02:00 UTC = 9:00 sáng giờ Việt Nam, mỗi ngày
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ viết caption, không đăng"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fb-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fb_autopost/requirements.txt

      - name: Install dependencies
        run: pip install -r fb_autopost/requirements.txt

      - name: Create post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python fb_autopost/autopost.py --dry-run
          else
            python fb_autopost/autopost.py
          fi

      - name: Save posted state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fb_autopost/posted.json
          git diff --cached --quiet || git commit -m "Cập nhật danh sách mẫu đã đăng"
          git push
